# Alembic 配置（M0）。开发用 SQLite，生产用 PostgreSQL。

[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./knowledge.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
qualname =
handlers = console

[logger_sqlalchemy]
level = WARN
qualname = sqlalchemy.engine
handlers =

[logger_alembic]
level = INFO
qualname = alembic
handlers =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
